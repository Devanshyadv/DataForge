version: 2

models:

  - name: stg_orders
    description: "Cleaned orders — one row per order"
    columns:
      - name: order_id
        description: "Primary key"
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - processing
                - created
                - approved
                - invoiced

  - name: stg_customers
    description: "Cleaned customers — one row per customer_id"
    columns:
      - name: customer_id
        description: "Primary key (one row per customer-order association)"
        tests: [not_null, unique]
      - name: customer_unique_id
        tests: [not_null]
      - name: state
        tests: [not_null]

  - name: stg_products
    description: "Cleaned products — one row per product"
    columns:
      - name: product_id
        description: "Primary key"
        tests: [not_null, unique]
      - name: category_name
        tests: [not_null]

  - name: stg_order_items
    description: "Cleaned order items — one row per order + item"
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: freight_value
        tests: [not_null]

  - name: stg_order_payments
    description: "Cleaned payments — one row per order + payment method"
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_value
        tests: [not_null]
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined
